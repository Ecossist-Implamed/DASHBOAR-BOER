<style>
  :root{
    --bg:#eef2f1;
    --card:#ffffff;
    --ink:#151b23;
    --ink-soft:#5b6774;
    --line:#e2e8e7;
    --brand:#0f6e6e;
    --brand-dark:#0a4b4b;
    --brand-bright:#149a94;
    --brand-soft:#e2eeed;
    --header-1:#123434;
    --header-2:#0a2222;
    --header-3:#041313;
    --accent:#e8590c;
    --accent-bright:#ff7a33;
    --accent-soft:#fff1e8;
    --radius:20px;
    --radius-sm:12px;
    --ease:cubic-bezier(.22,.9,.36,1);
    --shadow-sm:0 1px 2px rgba(15,25,35,.06), 0 2px 6px -2px rgba(15,25,35,.09);
    --shadow:0 2px 4px rgba(15,25,35,.06), 0 12px 28px -14px rgba(15,25,35,.18);
    --shadow-lg:0 8px 16px -6px rgba(15,25,35,.16), 0 24px 48px -20px rgba(15,25,35,.26);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    font-feature-settings:"ss01" on, "cv01" on;
    min-height:100vh;
  }
  a{color:inherit;}
  button{font-family:inherit;}

    max-width:820px;margin:0 auto;min-height:100vh;position:relative;
    background-color:var(--bg);

  /* Topbar */
  .topbar{
    position:sticky;top:0;z-index:20;
    background:
      radial-gradient(ellipse 480px 220px at 15% -20%, rgba(20,154,148,.35) 0%, rgba(20,154,148,0) 65%),
      linear-gradient(150deg,var(--header-1) 0%,var(--header-2) 55%,var(--header-3) 100%);
    color:#fff;padding:18px 18px 16px;
    box-shadow:0 4px 24px -6px rgba(0,0,0,.45);
    border-bottom:1px solid rgba(20,154,148,.35);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  }
  .topbar h1{margin:0;font-size:1.32rem;font-weight:800;letter-spacing:-.2px;}
  .topbar .sub{margin-top:3px;font-size:.78rem;opacity:.85;font-weight:500;}
  .topbar-row{display:flex;align-items:center;gap:12px;position:relative;}
  .credit-tag{
    position:absolute;top:-4px;right:0;color:#fff;font-size:.62rem;font-weight:600;
    opacity:.8;letter-spacing:.3px;white-space:nowrap;
  }
  .back-btn{
    display:none;align-items:center;justify-content:center;
    width:36px;height:36px;border-radius:50%;
    background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.18);color:#fff;
    font-size:1.1rem;cursor:pointer;flex-shrink:0;
    transition:background .15s var(--ease),transform .15s var(--ease);
  }
  .back-btn:active{background:rgba(255,255,255,.32);transform:scale(.92);}
  .back-btn.show{display:flex;}
  .month-banner{
    margin-top:12px;background:linear-gradient(120deg,var(--accent-bright),var(--accent));color:#fff;
    font-size:.76rem;font-weight:800;letter-spacing:.3px;text-transform:uppercase;
    padding:8px 12px;border-radius:12px;text-align:center;
    box-shadow:0 6px 16px -6px rgba(232,89,12,.55);
  }

  /* Search */
  .search-wrap{padding:16px 16px 4px;}
  .search-box{
    position:relative;
  }
  .search-box input{
    width:100%;padding:13px 16px 13px 42px;border-radius:999px;border:1px solid var(--line);
    background:#fff;font-size:.95rem;color:var(--ink);box-shadow:var(--shadow);
    outline:none;transition:box-shadow .18s var(--ease),border-color .18s var(--ease);
  }
  .search-box input:focus{border-color:var(--brand-bright);box-shadow:var(--shadow),0 0 0 4px var(--brand-soft);}
  .search-box .icon{position:absolute;left:15px;top:50%;transform:translateY(-50%);opacity:.45;font-size:1rem;}
  .search-results{padding:0 16px;margin-top:8px;}
  .search-results .hint{font-size:.78rem;color:var(--ink-soft);padding:2px 2px 8px;font-weight:500;}
  .search-result-item{
    display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);
    border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:8px;cursor:pointer;
    box-shadow:var(--shadow-sm);transition:transform .15s var(--ease),box-shadow .15s var(--ease);
  }
  .search-result-item:active{background:#f0f3f4;transform:scale(.98);}
  .sr-thumb{width:40px;height:40px;border-radius:9px;object-fit:cover;flex-shrink:0;background:#eee;}
  .sr-fam{font-size:.68rem;font-weight:700;color:var(--brand);text-transform:uppercase;letter-spacing:.4px;}
  .sr-name{font-size:.85rem;font-weight:600;line-height:1.25;}
  .sr-code{font-size:.72rem;color:var(--ink-soft);font-family:ui-monospace,Menlo,Consolas,monospace;}
  .sr-right{margin-left:auto;text-align:right;font-size:.78rem;font-weight:700;color:var(--accent);white-space:nowrap;}

  /* Home grid */
  #home{padding-bottom:32px;}
  .grid{
    display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:16px 16px 8px;
  }
  @media(min-width:560px){.grid{grid-template-columns:1fr 1fr 1fr;}}
  @keyframes cardIn{from{opacity:0;transform:translateY(12px) scale(.98);}to{opacity:1;transform:translateY(0) scale(1);}}
  .promo-card{
    background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);
    cursor:pointer;border:1px solid var(--line);display:flex;flex-direction:column;
    transition:transform .22s var(--ease),box-shadow .22s var(--ease);
    animation:cardIn .5s var(--ease) both;
    animation-delay:var(--d,0ms);
  }
  .promo-card:active{transform:scale(.96);box-shadow:var(--shadow-sm);}
  @media(hover:hover){
    .promo-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);}
    .promo-card:hover img{transform:scale(1.06);}
  }
  .promo-card .img-wrap{position:relative;aspect-ratio:4/3;background:#eef1f2;overflow:hidden;}
  .promo-card img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s var(--ease);}
  .promo-badge{
    position:absolute;top:9px;right:9px;background:linear-gradient(120deg,var(--accent-bright),var(--accent));color:#fff;
    font-size:.68rem;font-weight:800;padding:4px 9px;border-radius:20px;
    box-shadow:0 4px 10px -2px rgba(232,89,12,.55);letter-spacing:.2px;
  }
  .promo-badge.kit{background:linear-gradient(120deg,var(--brand-bright),var(--brand));box-shadow:0 4px 10px -2px rgba(15,110,110,.5);}
  .promo-card .info{padding:11px 13px 13px;}
  .promo-card .name{font-size:.95rem;font-weight:800;letter-spacing:.1px;}
  .promo-card .currency-tag{
    display:inline-block;font-size:.65rem;font-weight:700;color:var(--brand-dark);
    background:var(--brand-soft);padding:3px 8px;border-radius:8px;margin-top:6px;letter-spacing:.2px;
  }
  .promo-card .meta{font-size:.74rem;color:var(--ink-soft);margin-top:6px;line-height:1.3;}
  .promo-card .items-count{font-size:.7rem;color:var(--brand);font-weight:700;margin-top:6px;}

  .home-footer{padding:20px 20px 10px;text-align:center;font-size:.72rem;color:var(--ink-soft);}

  /* Detail */
  @keyframes viewIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  #detail{display:none;padding-bottom:40px;}
  #detail.show{display:block;animation:viewIn .32s var(--ease);}
  #home.hide{display:none;}
  .detail-hero{
    padding:16px;
  }
  .card{
    background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line);overflow:hidden;
  }
  .block1{margin-bottom:16px;}
  .block1 .img-wrap{width:100%;aspect-ratio:16/9;background:#eef1f2;overflow:hidden;}
  .block1 img{width:100%;height:100%;object-fit:cover;display:block;}
  .block1-body{padding:18px;}
  .block1-title{font-size:1.2rem;font-weight:800;margin:0 0 2px;letter-spacing:-.2px;}
  .block1-currency-note{font-size:.72rem;color:var(--ink-soft);margin-bottom:12px;font-weight:500;}
  .cond-row{
    display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);
    font-size:.88rem;
  }
  .cond-row:first-of-type{border-top:none;}
  .cond-label{color:var(--ink);}
  .cond-value{font-weight:700;color:var(--brand-dark);white-space:nowrap;}
  .cond-total{
    margin-top:12px;padding:14px 16px;border-radius:14px;
    background:linear-gradient(120deg,var(--brand-soft),#f0f8f7);
    border:1px solid #d5ece9;
    display:flex;justify-content:space-between;align-items:center;
  }
  .cond-total .lbl{font-size:.78rem;font-weight:800;color:var(--brand-dark);text-transform:uppercase;letter-spacing:.4px;}
  .cond-total .val{font-size:1.2rem;font-weight:800;color:var(--brand-dark);}

  .block2{padding:0;}
  .block2-toggle{
    width:100%;display:flex;align-items:center;justify-content:space-between;
    padding:17px 18px;background:none;border:none;font-size:1rem;font-weight:800;color:var(--ink);
    cursor:pointer;text-align:left;letter-spacing:-.1px;
  }
  .block2-toggle .chev{transition:transform .25s var(--ease);color:var(--brand);font-size:1.1rem;display:inline-block;}
  .block2-toggle.open .chev{transform:rotate(180deg);}
  .block2-count{color:var(--brand);font-weight:700;}
  @keyframes panelOpen{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:translateY(0);}}
  .block2-content{display:none;border-top:1px solid var(--line);padding:15px 16px 18px;}
  .block2-content.open{display:block;animation:panelOpen .28s var(--ease);}
  .item-search{
    width:100%;padding:11px 14px;border-radius:var(--radius-sm);border:1px solid var(--line);
    font-size:.88rem;margin-bottom:12px;outline:none;transition:border-color .18s var(--ease),box-shadow .18s var(--ease);
  }
  .item-search:focus{border-color:var(--brand-bright);box-shadow:0 0 0 4px var(--brand-soft);}
  .items-list{display:flex;flex-direction:column;gap:10px;max-height:none;}
  .item-card{
    border:1px solid var(--line);border-left:3px solid var(--brand-bright);border-radius:var(--radius-sm);
    padding:12px 13px;position:relative;background:#fbfcfc;
    transition:box-shadow .18s var(--ease),border-color .18s var(--ease);
  }
  @media(hover:hover){.item-card:hover{box-shadow:var(--shadow-sm);border-color:var(--brand-bright);}}
  .item-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;}
  .item-name{font-size:.86rem;font-weight:700;line-height:1.3;flex:1;}
  .item-code{font-size:.7rem;color:var(--ink-soft);font-family:ui-monospace,Menlo,Consolas,monospace;margin-top:2px;}
  .item-discount-badge{
    background:linear-gradient(120deg,var(--accent-bright),var(--accent));color:#fff;font-size:.72rem;font-weight:800;padding:3px 9px;
    border-radius:20px;white-space:nowrap;flex-shrink:0;box-shadow:0 3px 8px -2px rgba(232,89,12,.5);
  }
  .item-prices{margin-top:8px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
  .price-old{font-size:.78rem;color:var(--ink-soft);text-decoration:line-through;}
  .price-new{font-size:1.05rem;font-weight:800;color:var(--brand-dark);}
  .item-chips{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px;}
  .chip{
    font-size:.7rem;color:var(--ink-soft);background:#eef1f2;padding:4px 9px;border-radius:8px;font-weight:500;
  }
  .chip b{color:var(--ink);font-weight:700;}
  .no-results{padding:18px 4px;text-align:center;color:var(--ink-soft);font-size:.85rem;}
  .items-more{text-align:center;font-size:.78rem;color:var(--ink-soft);padding-top:6px;}

  ::selection{background:var(--brand-soft);}
</style>
</head>

<script>
(function(){
  "use strict";
  function showFatalError(e){
    try {
      var box = document.createElement('div');
      box.style.cssText = 'max-width:480px;margin:40px auto;padding:20px;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;text-align:center;color:#8a1f11;background:#fff3f0;border:1px solid #f3c9bd;border-radius:12px;';
      box.innerHTML = '<p style="font-weight:700;margin-bottom:8px;">Não foi possível carregar a página aqui.</p>' +
        '<p style="font-size:.85rem;color:#5b6774;">Tente abrir este arquivo direto no Chrome ou Safari (toque e segure o arquivo → "Abrir com"), em vez de dentro do WhatsApp, e-mail ou outro aplicativo.</p>' +
        '<p style="font-size:.72rem;color:#a55;margin-top:10px;">Detalhe técnico: ' + String(e && e.message ? e.message : e) + '</p>';
      document.body.insertBefore(box, document.body.firstChild);
    } catch (e2) { /* nothing more we can do */ }
  }
  try {
  var DATA = JSON.parse(document.getElementById('promo-data').textContent);
  var BUILD_DATE = "22/07/2026";
  var ITEM_RENDER_LIMIT = 60;

  document.getElementById('homeFooter').textContent = "Catálogo atualizado em " + BUILD_DATE + " — importe um novo arquivo todo mês para manter os preços em dia.";

  function fmtCurrency(v, symbol){
    if (v === null || v === undefined || v === "") return "-";
    var n = Number(v);
    if (isNaN(n)) return String(v);
    return symbol + " " + n.toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
  }
  function fmtPercent(v){
    if (v === null || v === undefined || v === "") return "-";
    return Math.round(Number(v)*100) + "%";
  }
  function fmtGeneric(v, type, currency){
    if (v === null || v === undefined || v === "") return null;
    if (type === "currency") return fmtCurrency(v, currency);
    if (type === "percent") return fmtPercent(v);
    if (typeof v === "number" && Number.isInteger(v)) return String(v);
    return String(v);
  }
  function niceLabel(h){
    if (!h) return "";
    return String(h).replace(/\s+/g," ").trim();
  }
  function escapeHtml(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  function currencyLabel(symbol){
    return symbol === "US$" ? "Dólar (US$)" : "Real (R$)";
  }

  function famBadge(fam){
    if (fam.schema === "discount" && fam.max_discount){
      return {text: "até -" + Math.round(fam.max_discount*100) + "%", cls:""};
    }
    if (fam.implied_discount_pct){
      return {text: "-" + fam.implied_discount_pct + "%", cls:""};
    }
    return {text: "kit promocional", cls:"kit"};
  }

  // ---------- HOME GRID ----------
  var grid = document.getElementById('grid');
  DATA.forEach(function(fam, famIdx){
    var badge = famBadge(fam);
    var card = document.createElement('div');
    card.className = 'promo-card';
    card.style.setProperty('--d', Math.min(famIdx, 12) * 45 + 'ms');
    card.innerHTML =
      '<div class="img-wrap">' +
        (fam.image ? '<img src="'+fam.image+'" alt="'+escapeHtml(fam.key)+'">' : '') +
        '<span class="promo-badge '+badge.cls+'">'+badge.text+'</span>' +
      '</div>' +
      '<div class="info">' +
        '<div class="name">'+escapeHtml(fam.key)+'</div>' +
        '<div class="currency-tag">Valores em '+currencyLabel(fam.currency)+'</div>' +
        '<div class="meta">Promoção: '+fmtCurrency(fam.total, fam.currency)+'</div>' +
        '<div class="items-count">'+fam.item_count+' itens</div>' +
      '</div>';
    card.addEventListener('click', function(){ openDetail(famIdx); });
    grid.appendChild(card);
  });

  // ---------- GLOBAL SEARCH ----------
  var globalSearch = document.getElementById('globalSearch');
  var searchResults = document.getElementById('searchResults');
  var homeGrid = document.getElementById('grid');

  function buildSearchIndex(){
    var idx = [];
    DATA.forEach(function(fam, famIdx){
      fam.items.forEach(function(row, rowIdx){
        var code = row[fam.code_idx];
        var name = row[fam.name_idx];
        idx.push({famIdx:famIdx, rowIdx:rowIdx, code:code, name:name, key:(String(code)+" "+String(name)).toLowerCase()});
      });
    });
    return idx;
  }
  var SEARCH_INDEX = buildSearchIndex();

  function priceSummary(fam, row){
    if (fam.disc_idx !== null && fam.disc_idx !== undefined){
      return fmtPercent(row[fam.disc_idx]) + " OFF";
    }
    var curCols = fam.col_types.map(function(t,i){return t==='currency'?i:-1;}).filter(function(i){return i>=0;});
    if (curCols.length){
      return fmtCurrency(row[curCols[curCols.length-1]], fam.currency);
    }
    return "";
  }

  function runGlobalSearch(q){
    q = q.trim().toLowerCase();
    if (!q){
      searchResults.innerHTML = '';
      homeGrid.style.display = '';
      return;
    }
    homeGrid.style.display = 'none';
    var matches = SEARCH_INDEX.filter(function(it){ return it.key.indexOf(q) !== -1; }).slice(0, 40);
    if (!matches.length){
      searchResults.innerHTML = '<div class="no-results">Nenhum item encontrado para "'+escapeHtml(q)+'"</div>';
      return;
    }
    var html = '<div class="hint">'+matches.length+' resultado(s)</div>';
    matches.forEach(function(m){
      var fam = DATA[m.famIdx];
      var row = fam.items[m.rowIdx];
      var srNameIsText = fam.name_is_text !== false;
      var srTitle = srNameIsText ? row[fam.name_idx] : row[fam.code_idx];
      var srCodeLine = srNameIsText ? ('<div class="sr-code">'+escapeHtml(row[fam.code_idx])+'</div>') : '';
      html += '<div class="search-result-item" data-fam="'+m.famIdx+'" data-row="'+m.rowIdx+'">' +
        (fam.image ? '<img class="sr-thumb" src="'+fam.image+'">' : '<div class="sr-thumb"></div>') +
        '<div>' +
          '<div class="sr-fam">'+escapeHtml(fam.key)+'</div>' +
          '<div class="sr-name">'+escapeHtml(srTitle)+'</div>' +
          srCodeLine +
        '</div>' +
        '<div class="sr-right">'+priceSummary(fam,row)+'</div>' +
      '</div>';
    });
    searchResults.innerHTML = html;
    Array.prototype.forEach.call(searchResults.querySelectorAll('.search-result-item'), function(el){
      el.addEventListener('click', function(){
        var famIdx = Number(el.getAttribute('data-fam'));
        var rowIdx = Number(el.getAttribute('data-row'));
        globalSearch.value = '';
        searchResults.innerHTML = '';
        homeGrid.style.display = '';
        openDetail(famIdx, DATA[famIdx].items[rowIdx][DATA[famIdx].code_idx]);
      });
    });
  }
  globalSearch.addEventListener('input', function(){ runGlobalSearch(globalSearch.value); });

  // ---------- DETAIL VIEW ----------
  var homeEl = document.getElementById('home');
  var detailEl = document.getElementById('detail');
  var backBtn = document.getElementById('backBtn');
  var topTitle = document.getElementById('topTitle');
  var topSub = document.getElementById('topSub');
  var block1 = document.getElementById('block1');
  var block2Toggle = document.getElementById('block2Toggle');
  var block2ToggleLabel = document.getElementById('block2ToggleLabel');
  var block2Content = document.getElementById('block2Content');
  var itemSearch = document.getElementById('itemSearch');
  var itemsList = document.getElementById('itemsList');
  var itemsMore = document.getElementById('itemsMore');

  var currentFamIdx = null;

  function renderBlock1(fam){
    var rowsHtml = fam.summary_rows.map(function(r){
      return '<div class="cond-row"><span class="cond-label">'+escapeHtml(r[1])+'</span>' +
        (r[2] != null ? '<span class="cond-value">'+fmtCurrency(r[2], fam.currency)+'</span>' : '') +
      '</div>';
    }).join('');
    block1.innerHTML =
      (fam.image ? '<div class="img-wrap"><img src="'+fam.image+'" alt="'+escapeHtml(fam.key)+'"></div>' : '') +
      '<div class="block1-body">' +
        '<div class="block1-title">'+escapeHtml(fam.key)+'</div>' +
        '<div class="block1-currency-note">Valores em '+currencyLabel(fam.currency)+'</div>' +
        rowsHtml +
        (fam.total != null ? '<div class="cond-total"><span class="lbl">Promoção</span><span class="val">'+fmtCurrency(fam.total, fam.currency)+'</span></div>' : '') +
      '</div>';
  }

  function renderItemCard(fam, row){
    var code = row[fam.code_idx];
    var nameIsText = fam.name_is_text !== false;
    var titleText = nameIsText ? row[fam.name_idx] : code;
    var curCols = fam.col_types.map(function(t,i){return t==='currency'?i:-1;}).filter(function(i){return i>=0;});
    var discIdx = fam.disc_idx;
    var priceHtml = '';
    var badgeHtml = '';
    var usedCols = {0:true};
    usedCols[fam.code_idx] = true;
    if (nameIsText) usedCols[fam.name_idx] = true;

    if (discIdx !== null && discIdx !== undefined && curCols.length >= 2){
      var origIdx = curCols[0], promoIdx = curCols[curCols.length-1];
      priceHtml = '<div class="item-prices">' +
        '<span class="price-old">'+fmtCurrency(row[origIdx], fam.currency)+'</span>' +
        '<span class="price-new">'+fmtCurrency(row[promoIdx], fam.currency)+'</span>' +
      '</div>';
      badgeHtml = '<span class="item-discount-badge">-'+Math.round(row[discIdx]*100)+'%</span>';
      usedCols[origIdx] = true; usedCols[promoIdx] = true; usedCols[discIdx] = true;
    } else if (fam.implied_discount_pct && curCols.length >= 1){
      // discount % is fixed for the whole family and only implied by the
      // column label (e.g. "Promoção com desconto 20%"), not a per-item column
      var priceIdx = curCols[curCols.length-1];
      priceHtml = '<div class="item-prices">' +
        '<span class="price-new">'+fmtCurrency(row[priceIdx], fam.currency)+'</span>' +
      '</div>';
      badgeHtml = '<span class="item-discount-badge">-'+fam.implied_discount_pct+'%</span>';
      usedCols[priceIdx] = true;
    }

    var chips = [];
    fam.items_header.forEach(function(h, i){
      if (usedCols[i]) return;
      var val = fmtGeneric(row[i], fam.col_types[i], fam.currency);
      if (val === null) return;
      chips.push('<span class="chip">'+escapeHtml(niceLabel(h))+': <b>'+escapeHtml(val)+'</b></span>');
    });

    var codeLineHtml = nameIsText ? ('<div class="item-code">'+escapeHtml(code)+'</div>') : '';
    return '<div class="item-card" data-code="'+escapeHtml(String(code))+'">' +
      '<div class="item-top">' +
        '<div><div class="item-name">'+escapeHtml(titleText)+'</div>'+codeLineHtml+'</div>' +
        badgeHtml +
      '</div>' +
      priceHtml +
      (chips.length ? '<div class="item-chips">'+chips.join('')+'</div>' : '') +
    '</div>';
  }

  function renderItems(fam, query, highlightCode){
    var q = (query||'').trim().toLowerCase();
    var rows = fam.items;
    if (q){
      rows = rows.filter(function(row){
        var code = String(row[fam.code_idx]||'').toLowerCase();
        var nm = String(row[fam.name_idx]||'').toLowerCase();
        return code.indexOf(q) !== -1 || nm.indexOf(q) !== -1;
      });
    }
    var shown = rows.slice(0, ITEM_RENDER_LIMIT);
    if (!shown.length){
      itemsList.innerHTML = '<div class="no-results">Nenhum item encontrado.</div>';
      itemsMore.textContent = '';
      return;
    }
    itemsList.innerHTML = shown.map(function(row){ return renderItemCard(fam, row); }).join('');
    if (rows.length > shown.length){
      itemsMore.textContent = 'Mostrando ' + shown.length + ' de ' + rows.length + ' itens — refine a busca para ver outros.';
    } else {
      itemsMore.textContent = '';
    }
    if (highlightCode){
      var target = null;
      var wanted = String(highlightCode);
      var candidates = itemsList.querySelectorAll('.item-card');
      for (var ci = 0; ci < candidates.length; ci++){
        if (candidates[ci].getAttribute('data-code') === wanted){ target = candidates[ci]; break; }
      }
      if (target){
        target.style.borderColor = 'var(--accent)';
        target.style.boxShadow = '0 0 0 2px var(--accent-soft)';
        setTimeout(function(){ target.scrollIntoView({behavior:'smooth', block:'center'}); }, 60);
      }
    }
  }

  function openDetail(famIdx, focusCode){
    currentFamIdx = famIdx;
    var fam = DATA[famIdx];
    topTitle.textContent = fam.key;
    topSub.textContent = fam.item_count + ' itens nesta promoção';
    backBtn.classList.add('show');
    homeEl.classList.add('hide');
    detailEl.classList.add('show');
    renderBlock1(fam);
    block2ToggleLabel.textContent = 'Itens da promoção (' + fam.item_count + ')';
    itemSearch.value = '';
    var openItems = !!focusCode;
    block2Toggle.classList.toggle('open', openItems);
    block2Content.classList.toggle('open', openItems);
    renderItems(fam, '', focusCode);
    window.scrollTo({top:0, behavior:'instant' in window ? 'instant' : 'auto'});
  }

  function closeDetail(){
    detailEl.classList.remove('show');
    homeEl.classList.remove('hide');
    backBtn.classList.remove('show');
    topTitle.textContent = 'Promoções';
    topSub.textContent = 'Toque em uma promoção para ver as condições e os itens';
    currentFamIdx = null;
  }

  backBtn.addEventListener('click', closeDetail);

  block2Toggle.addEventListener('click', function(){
    var open = block2Content.classList.toggle('open');
    block2Toggle.classList.toggle('open', open);
  });

  itemSearch.addEventListener('input', function(){
    if (currentFamIdx === null) return;
    renderItems(DATA[currentFamIdx], itemSearch.value);
  });

  // basic back-button support (mobile browser back gesture) via history state
  window.addEventListener('popstate', function(){
    if (detailEl.classList.contains('show')) closeDetail();
  });
  } catch (e) {
    showFatalError(e);
  }
})();
</script>
</body>
</html>
